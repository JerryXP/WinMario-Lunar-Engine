name: Issue in a Lunar Engine Fork
description: If you experience an issue in your Lunar Engine Fork that could be caused by the mainline code, you can try reporting it here 
labels: [external]
body:
  - type: textarea
    attributes:
      label: What is your issue?
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: "Command Prompt/Terminal logs (required)"
      render: bash
    validations:
      required: true

  - type: dropdown
    id: le-or-wm
    attributes:
      label: "Are you using Lunar Engine or Vs. WinMario?"
      options:
        - "Lunar Engine"
        - "Vs. WinMario"
    validations:
      required: true

  - type: input
    id: versionType
    attributes:
      label: "In which version does this occurs in? (if it's the build from the Actions tab, then also include the commit hash of the build)"
      placeholder: "3.2.1"
    validations:
      required: true

  - type: dropdown
    id: btarget
    attributes:
      label: "What is your build target?"
      options:
        - "Windows"
        - "Linux"
        - "Mac"
    validations:
      required: true

  - type: input
    id: buildsummary
    attributes:
      label: "What changes have you made in your fork?"
      placeholder: "I edited ClientPrefs.hx and tried to add a new setting"
    validations:
      required: true