name: Bug Report
description: Report bugs with the engine here
labels: ["Type: Bug","Awaits labels"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Describe your bug here."
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: "Terminal logs (latest.log)"
      render: bash
    validations:
      required: false

  - type: textarea
    id: modding
    attributes:
      label: "Are you modding your build? If so, enter the mods or scripts installed."
    validations:
      required: true
      
  - type: dropdown
    id: le-or-wm
    attributes:
      label: "Are you using Lunar Engine or Vs. WinMario?"
      options:
        - "Lunar Engine"
        - "Vs. WinMario"
    validations:
      required: true
      
  - type: input
    id: versionType
    attributes:
      label: "In which version does this occurs in? (if it's the build from the Actions tab, then also include the commit hash of the build)"
      placeholder: "3.2.1"
    validations:
      required: true

  - type: dropdown
    id: btarget
    attributes:
      label: "What platform did the issue occur?"
      options:
        - "Windows"
        - "Linux"
        - "Mac"
    validations:
      required: true
