name: Build the game

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  BuildDesktopCache:
    name: Build Caches
    permissions: write-all
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-24.04
      setupScript: sh ./setup/unix.sh
      CACHE_NAME: LunarEngine.1.0.desktop-cache

  BuildMacos:
    name: macos
    needs: BuildDesktopCache
    permissions: write-all
    uses: ./.github/workflows/mac-universal.yml
    with:
      exportPath: macos
      cachePath: LunarEngine.build-mac
      cacheLibrariesPath: LunarEngine.1.0.desktop-cache
      artifactName: LunarEngine-mac
      artifactPath: export/release/macos/bin/*

  BuildDesktop:
    name: Build Desktop
    needs: BuildDesktopCache
    permissions: write-all
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: "windows -final"
            exportPath: windows
            artifactName: LunarEngine-windows
            cacheLibrariesPath: LunarEngine.1.0.desktop-cache
            cachePath: LunarEngine.build-windows
            artifactPath: export\release\windows\bin\*
          - name: Linux
            os: ubuntu-22.04
            buildArgs: "linux -final"
            exportPath: linux
            artifactName: LunarEngine-linux
            cachePath: LunarEngine.build-linux
            cacheLibrariesPath: LunarEngine.1.0.desktop-cache
            artifactPath: export/release/linux/bin/*

    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      cacheLibrariesPath: ${{ matrix.cacheLibrariesPath }}
      exportPath: ${{ matrix.exportPath }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      cachePath: ${{ matrix.cachePath }}